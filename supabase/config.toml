# Extrait de configuration Supabase CLI pour ce projet (les autres valeurs gardent leurs défauts).
project_id = "vihzevndxgwetrwtaexp"

[functions.device-api]
# Authentification par jeton d'appareil haché, vérifiée dans la fonction.
verify_jwt = false

[functions.ai]
# JWT utilisateur vérifié dans la fonction (getClaims), recommandé avec les clés de signature asymétriques.
verify_jwt = false

[auth]
site_url = "https://vtc-perso-lolo.netlify.app"
additional_redirect_urls = ["https://vtc-perso-lolo.netlify.app"]

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
